<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DREX FLEET COMMAND</title>
<style>
:root{--bg:#0a0a0b;--panel:#141416;--panel2:#1c1c1f;--line:#2c2c30;--ink:#e9e6da;--dim:#8d8b82;--sig:#ffd400;--sigd:#8a7300;--bad:#ff4d3d;--ok:#6fdc6f;--unk:#6f7ba0;
--mono:"JetBrains Mono","IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 var(--mono)}
body{background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px)}
header{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:2px solid var(--sig);background:#000;position:sticky;top:0;z-index:5;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:.22em;color:var(--sig);font-size:15px}.logo small{display:block;color:var(--dim);letter-spacing:.18em;font-weight:400;font-size:9px}
nav{display:flex;gap:2px;flex-wrap:wrap}nav a{color:var(--dim);text-decoration:none;padding:7px 14px;border:1px solid var(--line);letter-spacing:.16em;font-size:11px;text-transform:uppercase}
nav a.on{background:var(--sig);color:#000;border-color:var(--sig);font-weight:700}
.stat{margin-left:auto;text-align:right;font-size:11px;color:var(--dim)}.stat b{color:var(--sig)}
.stripe{height:6px;background:repeating-linear-gradient(135deg,var(--sig) 0 10px,#000 10px 20px)}
main{padding:16px;max-width:1500px;margin:0 auto}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.grid.w2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);padding:12px 14px;position:relative}
.card:before,.card:after{content:"";position:absolute;width:9px;height:9px;border:2px solid var(--sig)}.card:before{top:-1px;left:-1px;border-right:0;border-bottom:0}.card:after{bottom:-1px;right:-1px;border-left:0;border-top:0}
h2{margin:18px 0 8px;font-size:11px;letter-spacing:.24em;color:var(--sig);text-transform:uppercase;font-weight:700}h2:first-child{margin-top:0}
.k{color:var(--dim);font-size:10px;letter-spacing:.16em;text-transform:uppercase}.v{font-size:28px;font-weight:700;margin:2px 0;color:var(--ink)}.v.sm{font-size:18px}
.src{color:var(--dim);font-size:10px;margin-top:4px}
.tag{display:inline-block;padding:0 6px;font-size:10px;letter-spacing:.12em;border:1px solid;margin-left:6px;vertical-align:middle}
.t-ok{color:var(--ok);border-color:var(--ok)}.t-bad{color:var(--bad);border-color:var(--bad)}.t-stale{color:#000;background:var(--sig);border-color:var(--sig)}.t-unk{color:var(--unk);border-color:var(--unk)}.t-no{color:var(--dim);border-color:var(--line)}
table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:var(--dim);font-weight:400;font-size:10px;letter-spacing:.14em;text-transform:uppercase;border-bottom:1px solid var(--line);padding:4px 6px}
td{padding:5px 6px;border-bottom:1px solid #202023;vertical-align:top;word-break:break-word}
.q{color:var(--dim);font-style:italic}.bar{height:6px;background:var(--panel2);margin-top:5px}.bar i{display:block;height:100%;background:var(--sig)}
pre{white-space:pre-wrap;margin:0;font-size:11px;color:var(--dim);max-height:220px;overflow:auto}
.dim{color:var(--dim)}.bad{color:var(--bad)}.ok{color:var(--ok)}.sig{color:var(--sig)}
footer{padding:14px 16px;color:var(--dim);font-size:10px;letter-spacing:.1em;border-top:1px solid var(--line)}
@media(max-width:600px){main{padding:10px}.grid.w2{grid-template-columns:1fr}.v{font-size:22px}}
</style></head><body>
<header><div class="logo">DREX FLEET COMMAND<small>ELYREON // READ-ONLY // LOCALHOST</small></div>
<nav id="nav"></nav><div class="stat" id="stat">connecting…</div></header><div class="stripe"></div>
<main id="main"></main><footer>REAL DATA ONLY · UNKNOWN = no source wired · STALE = older than the metric's freshness bound · auto-refresh 10 s · GET-only, no controls</footer>
<script>
const VIEWS=["overview","dots","sales","revenue","linkedin","system","model_usage"];let view=(location.hash||"#overview").slice(1);if(!VIEWS.includes(view))view="overview";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const age=s=>s==null?"never":s<90?Math.round(s)+"s":s<5400?Math.round(s/60)+"m":s<172800?(s/3600).toFixed(1)+"h":Math.round(s/86400)+"d";
const N=v=>v==null?"—":Number(v).toLocaleString();
let NOW=Date.now()/1000;
function fresh(asof,bound){if(asof==null)return `<span class="tag t-unk">UNKNOWN</span>`;const a=NOW-asof;return a>bound?`<span class="tag t-stale">STALE ${age(a)}</span>`:`<span class="tag t-ok">${age(a)} ago</span>`}
function card(k,v,src,asof,bound,cls){return `<div class="card"><div class="k">${esc(k)}</div><div class="v ${cls||""}">${v==null?'<span class="dim">UNKNOWN</span>':esc(v)}</div><div class="src">${esc(src)} ${asof===undefined?"":fresh(asof,bound)}</div></div>`}
function unk(k,why){return `<div class="card"><div class="k">${esc(k)}</div><div class="v"><span class="dim">UNKNOWN</span></div><div class="src">${esc(why)} <span class="tag t-unk">NO SOURCE</span></div></div>`}
function table(cols,rows,fmt){if(!rows||!rows.length)return `<div class="dim">none</div>`;return `<table><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr>${rows.map(r=>`<tr>${fmt(r).map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</table>`}
const stTag=s=>({SUCCEEDED:"t-ok",DEAD:"t-bad",RETRY:"t-stale",LEASE_EXPIRED:"t-stale",active:"t-ok"}[s]||"t-no");
function tasksCards(c,l){const g=(o,k)=>(o||{})[k]||0;return card("Tasks succeeded · 24h",N(g(l,"SUCCEEDED")),"fleet.db fleet_tasks",NOW,60)+card("Failed / dead-letter",N(g(c,"DEAD")+g(c,"FAILED")),"all time · bounded retries then DEAD",NOW,60,g(c,"DEAD")?"bad":"")+card("Queued · leased",N(g(c,"QUEUED"))+" · "+N(g(c,"LEASED")),"fleet.db",NOW,60)}
const ZERO_DEC=new Set(["bif","clp","djf","gnf","jpy","kmf","krw","mga","pyg","rwf","ugx","vnd","vuv","xaf","xof","xpf"]);
function money(m,c){if(m==null)return null;const a=Math.abs(m);const t=ZERO_DEC.has(c)?String(a):Math.floor(a/100)+"."+String(a%100).padStart(2,"0");return (m<0?"-":"")+t+" "+String(c).toUpperCase()}
const pct=v=>v==null?null:(v*100).toFixed(1)+"%";
function ovRev(rv){const f=(rv||{}).data&&rv.data.feed;if(!f||f.periods.all_time.paid_orders==null)return unk("Verified sales","revenue feed UNKNOWN (open Revenue tab)")+unk("Net proceeds","revenue feed UNKNOWN");const cs=Object.entries(f.periods.all_time.currencies||{}),t=rv.as_of;if(!cs.length)return card("Verified sales","0","Stripe-reconciled paid sessions (zero verified)",t,900,"ok")+card("Net proceeds","0.00 (verified)","no paid sessions",t,900);return cs.map(([c,x])=>card("Verified sales · "+c.toUpperCase(),N(x.paid_orders)+" · "+money(x.gross_minor,c),"Stripe gross, all time",t,900)+card("Net proceeds · "+c.toUpperCase(),money(x.net_minor,c),"gross − refunds − fees",t,900,x.net_minor==null?"sig":"ok")).join("")}
function revenueView(d){const rv=d.revenue||{},f=rv.feed,lat=rv.last_attempt;
if(!f)return `<h2>Revenue</h2><div class="card bad">REVENUE FEED UNKNOWN — no verified snapshot yet. ${rv.unreachable?"Last fetch failed: "+esc((lat||{}).detail||""):"Waiting for first commerce.revenue_observe run."}</div>`;
const st=f.sources.stripe,d1=f.sources.d1,P=f.periods,cur=P.all_time.currencies||{},stale=(NOW-rv.as_of)>900||rv.unreachable||st.status!=="OK";
const banner=`<div class="card ${stale?"bad":""}"><b>${stale?"STALE / DEGRADED":"LIVE"}</b> <span class="tag t-ok">live data · not a sample</span> feed ${fresh(rv.as_of,900)} · Stripe reconcile <span class="tag ${st.status==="OK"?"t-ok":st.status==="STALE"?"t-stale":"t-unk"}">${esc(st.status)}</span> ${fresh(st.as_of,2700)} · D1 ${esc(d1.status)} (${N(d1.orders)} orders) ${fresh(d1.as_of,900)}${rv.unreachable?`<br><span class="bad">last fetch FAILED: ${esc((lat||{}).detail||"")}</span>`:""}${st.last_error?`<br><span class="bad">Stripe: ${esc(st.last_error)}</span>`:""}<div class="src">${esc(f.method)}</div></div>`;
const heads=P.all_time.verified?(Object.keys(cur).length?Object.entries(cur).map(([c,x])=>`<h2>All time · ${esc(c.toUpperCase())}</h2><div class="grid">${card("Gross sales",money(x.gross_minor,c),"Stripe paid checkout sessions",st.as_of,2700)}${card("Paid orders",N(x.paid_orders),"unique checkout sessions",st.as_of,2700)}${card("Refunds",money(x.refunds_minor,c),"Stripe charge.amount_refunded",st.as_of,2700)}${card("Stripe fees",money(x.fees_minor,c),x.fee_unknown_orders?x.fee_unknown_orders+" order(s) without fee data":"balance_transaction.fee",st.as_of,2700,x.fees_minor==null?"sig":"")}${card("Net proceeds",money(x.net_minor,c),"gross − refunds − fees (not profit)"+(x.disputed_orders?" · disputed: UNKNOWN":""),st.as_of,2700,x.net_minor!=null?"ok":"sig")}${card("Fulfillment rate",pct(x.fulfillment_rate),x.fulfilled_orders+" of "+x.paid_orders+" delivered (D1)",d1.as_of,900)}</div>`).join(""):`<h2>All time</h2><div class="grid">${card("Gross sales","0.00 (verified)","Stripe reconciled; zero paid sessions on the payment link",st.as_of,2700,"ok")}${card("Paid orders","0","verified by Stripe reconcile",st.as_of,2700,"ok")}</div>`):`<h2>All time</h2><div class="grid">${unk("Gross / net","Stripe has not reconciled")}</div>`;
const prow=[];for(const [p,b] of Object.entries(P)){if(!b.verified){prow.push([p,"UNKNOWN","","","","",""]);continue}const cs=Object.entries(b.currencies);if(!cs.length)prow.push([p,"0 (verified)","","","","",""]);for(const [c,x] of cs)prow.push([p,N(x.paid_orders)+" "+c.toUpperCase(),money(x.gross_minor,c)||"UNKNOWN",money(x.refunds_minor,c)||"UNKNOWN",money(x.fees_minor,c)||"UNKNOWN",money(x.net_minor,c)||"UNKNOWN",pct(x.fulfillment_rate)||"—"])}
const dl=[];for(const [c,days] of Object.entries(f.daily||{}))for(const x of days.slice(-14))dl.push([x.day,c.toUpperCase(),N(x.orders),money(x.gross_minor,c),money(x.net_minor,c)||"UNKNOWN"]);
const o=f.operations,fn=f.funnel,ex=f.exceptions||[];
return banner+heads+`<h2>Periods</h2><div class="card">${table(["period","orders","gross","refunds","fees","net proceeds","fulfilled"],prow,r=>r.map(esc))}</div>
<h2>Trend · last 14 days</h2><div class="card">${dl.length?table(["day","cur","orders","gross","net"],dl,r=>r.map(esc)):'<span class="dim">no sales in window (verified by Stripe reconcile)</span>'}</div>
<h2>Operations</h2><div class="grid">${card("Pending deliveries",N(o.pending_deliveries),"D1 orders delivery_pending/delivering",d1.as_of,900,o.pending_deliveries?"sig":"")}${card("Failed / unknown deliveries",N(o.failed_or_unknown_deliveries),"D1 delivery_failed + delivery_unknown",d1.as_of,900,o.failed_or_unknown_deliveries?"bad":"")}${card("Refunded orders",N(o.refunded_orders),"Stripe",st.as_of,2700,o.refunded_orders?"sig":"")}${card("Disputed orders",N(o.disputed_orders),"Stripe disputes: "+(st.disputes||"UNKNOWN"),st.as_of,2700,o.disputed_orders?"bad":"")}${card("Webhook events / orders",N(o.events_received)+" / "+N(o.unique_order_sessions),"stripe_events rows vs unique sessions (idempotent)",d1.as_of,900)}</div>
<h2>Revenue exceptions</h2><div class="card ${ex.length?"bad":""}">${ex.length?table(["severity","kind","ref","detail"],ex,x=>[esc(x.severity),esc(x.kind),esc(x.ref||"—"),esc(x.detail)]):'<span class="ok">none (D1 and Stripe reconcile clean)</span>'}</div>
<h2>Latest orders (redacted)</h2><div class="card">${table(["ref","paid","amount","status","stripe","refunded"],o.latest_orders,x=>[esc(x.ref),age(NOW-x.paid_at)+" ago",esc(money(x.amount_minor,x.currency)),`<span class="tag ${x.status==="fulfilled"?"t-ok":x.status==="delivery_failed"||x.status==="delivery_unknown"?"t-bad":"t-stale"}">${esc(x.status)}</span>`,x.stripe_verified==null?"UNKNOWN":x.stripe_verified?"verified":"NOT FOUND",x.refunded_minor==null?"UNKNOWN":esc(money(x.refunded_minor,x.currency))])}</div>
<h2>Funnel</h2><div class="grid">${unk("Visits",fn.visits_reason)}${card("Checkout starts · 30d",N((fn.checkout_starts||{})["30d"]),fn.source,rv.as_of,900)}${card("Purchases · 30d",N((fn.purchases||{})["30d"]),"paid sessions",rv.as_of,900)}${card("Checkout→purchase · 30d",pct((fn.checkout_to_purchase_rate||{})["30d"]),"paid ÷ started (NOT visit conversion)",rv.as_of,900)}${unk("Visit→purchase conversion","needs visit instrumentation")}</div>`}
const R={
linkedin(d){const x=d.linkedin_schedule||{},p=(x.plan||{}),posts=p.posts||[];
if(x.status!=="READY")return `<h2>LinkedIn · manual schedule</h2><div class="card"><span class="tag t-unk">UNKNOWN</span> Schedule unavailable: ${esc(x.reason||"no schedule source")}</div>`;
return `<h2>LinkedIn · manual post plan</h2><div class="card"><span class="tag t-stale">SUGGESTED TIMES</span> ${esc(p.note||"")}<div class="src">Campaign ${esc(p.campaign||"UNKNOWN")} · timezone ${esc(p.timezone||"UNKNOWN")} · source ${esc(x.source)} · posting and engagement are not verified</div></div>
${posts.map(q=>`<div class="card" style="margin:10px 0"><div class="k">Variant ${esc(q.variant)} · ${esc(q.theme)}</div><div class="v sm">${esc((q.suggested_at_local||"UNKNOWN").replace("T"," ")+" "+(p.timezone||""))}</div><div style="white-space:pre-wrap;margin:10px 0">${esc(q.copy)}</div><span class="tag t-stale">${esc(q.status)} · manual</span></div>`).join("")}
<div class="card">Tracker: update <code>${esc(p.tracker_path||"content/manual-batch/tracker.csv")}</code> yourself after publishing. Only your manual entries are recorded; Fleet cannot verify the post URL or engagement.</div>`},
revenue:revenueView,
overview(d){const w=d.workers||[],ls=d.live_sales||{},fu=(d.funnel.data||{}),ds=fu.disco||{},sd=(d.sender.data||{}),q=(sd.quota||{}),sc=(d.scout.data||{});
const alive=w.filter(x=>x.alive).length,ops=d.operational.length;
return `<h2>Fleet health</h2><div class="grid">
${card("Workers alive",alive+" / "+ops,"heartbeat < 30 s · operational dots",NOW,60,alive===ops&&ops?"ok":"bad")}
${card("Dots registered",(d.operational.length+d.not_operational.length),d.operational.length+" operational · "+d.not_operational.length+" NOT_OPERATIONAL",NOW,60)}
${tasksCards(d.core.counts,d.core.last24h)}</div>
<h2>Current worker activity</h2><div class="card">${table(["worker","state","task","heartbeat"],w,x=>[esc(x.dot),`<span class="tag ${x.alive?"t-ok":"t-bad"}">${x.alive?(x.current_kind?"BUSY":"IDLE"):"DOWN"}</span>`,esc(x.current_kind||"—"),age(x.hb_age_s)])}</div>
<h2>LinkedIn bridge · local observation</h2><div class="grid">${card("Bridge status",(d.linkedin.data||{}).status||"UNKNOWN","local bridge database",d.linkedin.as_of,900,(d.linkedin.data||{}).status==="OK"?"ok":"sig")}${card("Campaigns",N((d.linkedin.data||{}).campaign_count),"local aggregate",d.linkedin.as_of,900)}${card("Pending / unknown actions",N((d.linkedin.data||{}).pending_actions)+" / "+N((d.linkedin.data||{}).unknown_actions),"transport disabled by default",d.linkedin.as_of,900)}</div>
<h2>Leads &amp; outreach</h2><div class="grid">
${card("Raw records discovered",N(ds.raw),"disco_raw · analyst snapshot",d.funnel.as_of,900)}
${card("Unique companies",N(ds.candidates),"disco_candidates",d.funnel.as_of,900)}
${card("Qualified (staged+promoted)",N(ds.qualified_total),"gates: role addr · same domain · MX · evidence",d.funnel.as_of,900)}
${card("Emails sent · total",N(ls.sent_total),"sales_send_intents SENT (live read)",ls.as_of,120)}
${card("Sent · last 24 h",N(ls.sent_24h)+" / "+N(q.sales_budget_if_idle),"Sales Dot allocation (effective cap "+N(q.effective_cap_24h)+" − reserve "+N(q.reserve)+")",ls.as_of,120)}
${card("Replies received",N(ls.replies),"sales_inbound REPLY matched to an outreach prospect (live)",ls.as_of,120,ls.replies?"ok":"")}
${card("Hard/soft bounces",N(ls.bounces),"sales_inbound BOUNCE*",ls.as_of,120)}</div>
<h2>Outcomes &amp; cost</h2><div class="grid">
${ovRev(d.revenue)}${unk("Meetings",d.unknown.meetings)}${unk("Conversions",d.unknown.conversions)}
${card("Fleet model spend",d.cost.fleet_model_usd==null?null:"$"+d.cost.fleet_model_usd.toFixed(4),(d.cost.calls??"?")+" model calls by fleet dots (adapters are deterministic)",NOW,3600)}
${unk("Luna / Codex subscription",d.unknown.luna_subscription_cost)}</div>
<h2>Recent attempts</h2><div class="card">${table(["when","dot","kind","outcome","detail"],d.recent,x=>[age(NOW-x.at)+" ago",esc(x.dot),esc(x.kind),`<span class="tag ${stTag(x.outcome)}">${esc(x.outcome)}</span>`,esc((x.detail||"").slice(0,110))])}</div>`},
dots(d){return `<h2>Dots</h2><div class="grid w2">${d.dots.map(x=>{const w=x.worker;return `<div class="card"><div class="k">${esc(x.role)} · ${esc(x.name)}</div>
<div class="v sm">${x.operational?`<span class="tag t-ok">OPERATIONAL</span>`:`<span class="tag t-no">NOT_OPERATIONAL</span>`}${w?` <span class="tag ${w.alive?"t-ok":"t-bad"}">${w.alive?(w.current_kind?"BUSY":"IDLE"):"DOWN"}</span> <span class="dim">hb ${age(w.hb_age_s)}</span>`:""}</div>
<p>${esc(x.mission)}</p>${x.not_operational_reason?`<p class="bad">BLOCKER: ${esc(x.not_operational_reason)}</p>`:""}
<div class="k">Permissions</div><div>allow: ${x.capabilities.allow.map(esc).join(", ")||"—"}<br><span class="dim">deny: ${x.capabilities.deny.map(esc).join(", ")}</span></div>
<div class="k" style="margin-top:6px">Budget</div><div class="dim">${esc(JSON.stringify(x.budget))}</div>
<div class="k" style="margin-top:6px">Tasks</div><div>${Object.entries(x.task_counts).map(([k,v])=>`${esc(k)} ${v}`).join(" · ")||"none"} · receipts ${x.receipts.n} (blocked ${x.receipts.blocked||0})</div>
${x.last_error?`<div class="bad src">last error: ${esc(x.last_error.slice(0,160))}</div>`:""}
<div class="k" style="margin-top:6px">Activity / receipts</div>${table(["when","kind","outcome","receipt"],x.history,h=>[age(NOW-h.at),esc(h.kind),`<span class="tag ${stTag(h.outcome)}">${esc(h.outcome)}</span>`,esc(h.receipt_id||"—")])}</div>`}).join("")}</div>`},
sales(d){const ls=d.live_sales||{},fu=d.funnel.data||{},ds=fu.disco||{},sl=fu.sales||{},sd=d.sender.data||{},q=sd.quota||{},el=fu.eligible_queue||{},dl=d.deliverability.data||{},dg=fu.send_diag||{};
const st=ds.stages||{};const max=Math.max(1,ds.raw||0);
const stage=(n,v)=>`<tr><td>${esc(n)}</td><td>${N(v)}</td><td style="width:55%"><div class="bar"><i style="width:${Math.min(100,100*(v||0)/max)}%"></i></div></td></tr>`;
return `<h2>Discovery funnel</h2><div class="grid w2"><div class="card"><table>${stage("raw records",ds.raw)}${stage("unique companies",ds.candidates)}${stage("qualified (staged)",st.QUALIFIED)}${stage("promoted → drafted",st.PROMOTED)}${stage("send-eligible drafts",el.eligible)}${stage("sent",sl.sent_by_this_dot)}${stage("replied",sl.replies_received)}</table><div class="src">disco_* tables · analyst snapshot ${fresh(d.funnel.as_of,900)}</div></div>
<div class="card"><div class="k">Top rejection reasons</div>${table(["reason","n"],Object.entries(ds.rejections||{}).slice(0,10),r=>[esc(r[0]),N(r[1])])}<div class="src">${fresh(d.funnel.as_of,900)}</div></div></div>
<h2>Outbound volume &amp; quota</h2><div class="grid">
${card("Sent last 24 h",N(ls.sent_24h),"live CRM read",ls.as_of,120)}${card("Sales allocation",N(q.sales_budget_if_idle),"effective cap "+N(q.effective_cap_24h)+" (limited by "+(q.limited_by||"?")+"; provider "+N(q.provider_limit_24h)+", owner target "+N(q.owner_target_24h)+") − reserve "+N(q.reserve)+" kept",d.sender.as_of,300)}
${card("Account sends 24h (Gmail count, cached)",q.account_sends_24h_cached?N(q.account_sends_24h_cached.n):null,"counted by sender while in-window; null = not measured outside window",d.sender.as_of,300)}
${card("Send window",sd.in_window?"OPEN":"CLOSED",sd.window||"",d.sender.as_of,300,sd.in_window?"ok":"")}
${card("Sender heartbeat",sd.heartbeat_age_s==null?null:age(sd.heartbeat_age_s),"drex-sales-dot (single authoritative sender)",d.sender.as_of,300,sd.heartbeat_age_s<180?"ok":"bad")}
${card("Emergency stop / pause",sd.emergency_stop||sd.stop_file||sd.paused_until?"ACTIVE":"none",sd.pause_reason||"",d.sender.as_of,300)}</div>

<div class="card"><div class="k">Why drafts are blocked</div>${table(["reason","n"],Object.entries(el.blocked_reasons||{}),r=>[esc(r[0]),N(r[1])])}</div></div>

<div class="card"><div class="k">Send diagnostics (60 sends / 0 replies)</div><div>to blocklisted domains: ${N(dg.to_blocklisted_domains)} · unmatched inbound: ${N(dg.unmatched_inbound)}<br>historic sends: ${N(sl.sent_historic)} · by this dot: ${N(sl.sent_by_this_dot)} · failed intents: ${N(sl.failed_intents)}</div></div></div>
<h2>Prospect evidence (staged, verbatim from company page)</h2><div class="card">${table(["company","cat","rank","address","quote"],ds.top_staged,x=>[esc(x.company_name||x.domain),esc(x.business_category),N(x.rank),esc(x.contact_email),`<span class="q">“${esc((x.signal_quote||"").slice(0,140))}”</span><br><a class="dim" href="${esc(x.signal_url)}" rel="noreferrer noopener" target="_blank">${esc(x.signal_url)}</a>`])}</div>
<h2>Last promotion run</h2><div class="card">${d.promotion.data?`<div>${d.promotion.data.dry_run?"DRY RUN":"EXECUTED"} · passed ${(d.promotion.data.passed||[]).length} · rejected ${(d.promotion.data.rejected||[]).length} · promoted ${(d.promotion.data.promoted||[]).length} ${fresh(d.promotion.as_of,86400*30)}</div>${table(["domain","reasons"],d.promotion.data.rejected||[],r=>[esc(r.domain),esc((r.reasons||[]).join(", "))])}`:'<span class="dim">no promotion run recorded</span>'}</div>`},
system(d){const h=d.host.data||{},cl=d.cluster.data||{},mem=h.mem||{};const used=mem.MemTotal?(100*(1-mem.MemAvailable/mem.MemTotal)).toFixed(0)+"%":null;

${Object.entries(h.disks||{}).map(([k,v])=>card("Disk "+k,v.pct+"%",(v.total/2**30).toFixed(0)+" GiB",d.host.as_of,180,v.pct>90?"bad":"")).join("")}</div>

<div class="card"><div class="k">N1 money gate (read-only)</div><pre>${esc((cl.n1_gate||{}).text||"UNKNOWN")}</pre></div><div class="card"><div class="k">N4 forward lab (read-only)</div><pre>${esc((cl.n4_lab||{}).text||"UNKNOWN")}</pre></div></div>
<h2>Failed jobs / dead letters</h2><div class="card">${table(["when","dot","kind","tries","error"],d.dead,x=>[age(NOW-x.updated_at)+" ago",esc(x.dot),esc(x.kind),x.attempts,esc((x.last_error||"").slice(0,140))])}</div>
<h2>Logs · alerts</h2><div class="grid w2"><div class="card"><div class="k">Sender alerts.jsonl (last 15)</div>${table(["when","kind","detail"],(h.alerts||[]).slice().reverse(),a=>[age(NOW-a.ts)+" ago",esc(a.kind),esc(JSON.stringify(Object.fromEntries(Object.entries(a).filter(([k])=>!["ts","kind"].includes(k)))).slice(0,120))])}</div>
<div class="card"><div class="k">Non-success attempts</div>${table(["when","dot","outcome","detail"],d.recent,x=>[age(NOW-x.at)+" ago",esc(x.dot),`<span class="tag ${stTag(x.outcome)}">${esc(x.outcome)}</span>`,esc((x.detail||"").slice(0,100))])}</div></div>
${(h.findings||[]).length?`<h2>Findings</h2><div class="card bad">${h.findings.map(esc).join("<br>")}</div>`:""}`},
model_usage(d){
const P=d.providers||[],RL=d.rate_limits||[],CSL=d.claude_session_limits||[],FJ=d.fett_lite||{},QC=(d.quota_cache||{}).providers||{},AL=d.alerts||[];
const curW=window.muWindow||"24h";const an=(d.analytics||{})[curW]||(d.analytics||{})["all"]||{};const sp=d.spending||{};const cov=an.local_log_coverage_start||{};const coverageFor=k=>k.startsWith("codex_1")?cov.codex_1:k.startsWith("codex_2")?cov.codex_2:k.startsWith("kimi")?cov.kimi:k.startsWith("grok")?cov.grok:null;
const availCount=P.filter(p=>p.status==="AVAILABLE").length;const rlCount=P.filter(p=>p.status==="RATE_LIMITED").length;
const authFailCount=P.filter(p=>p.status==="AUTH_FAILED"||p.status==="DISCONNECTED").length;
const pTag=s=>({AVAILABLE:"t-ok",RATE_LIMITED:"t-bad",AUTH_FAILED:"t-bad",DISCONNECTED:"t-no",UNKNOWN:"t-unk",OWNER_RESERVED:"t-unk",BLOCKED_BY_POLICY:"t-no"}[s]||"t-unk");
const quotaRows=[];
for(const w of ((QC.anthropic||{}).windows||[]))quotaRows.push(["anthropic (Hermes)","claude-sonnet-4-6",esc(w.label),w.used_percent!=null?w.used_percent+"%":"—",w.reset_expired?"expired":w.remaining_s!=null?age(w.remaining_s):"—",esc(w.reset_at||"—"),`<span class="tag ${d.quota_cache.status==="MEASURED"?'t-ok':'t-unk'}">${esc(d.quota_cache.status||"UNKNOWN")}</span>`]);
for(const w of ((QC["openai-codex"]||{}).windows||[]))quotaRows.push(["OpenAI (account unknown; not assigned to Codex1/2)","model unknown",esc(w.label),w.used_percent!=null?w.used_percent+"%":"—",w.reset_expired?"expired":w.remaining_s!=null?age(w.remaining_s):"—",esc(w.reset_at||"—"),`<span class="tag ${d.quota_cache.status==="MEASURED"?'t-ok':'t-unk'}">${esc(d.quota_cache.status||"UNKNOWN")}</span>`]);
for(const p of P.filter(x=>x.id==="codex_1"||x.id==="codex_2"))for(const w of (p.quota_windows||[]))quotaRows.push([esc(p.account_alias),esc(p.model),esc(w.label||w.window_minutes+"m"),w.used_percent!=null?w.used_percent+"%":"—",w.reset_expired?"expired":w.remaining_s!=null?age(w.remaining_s):"—",w.reset_at?esc(new Date(w.reset_at*1000).toISOString()):"—",`<span class="tag ${d.nova_router_status&&d.nova_router_status.status==="MEASURED"?'t-ok':'t-unk'}">${esc(d.nova_router_status?.status||"UNKNOWN")}</span>`]);
const grokP=P.find(p=>p.id==="grok_cli");if(grokP)quotaRows.push(["xai (Grok)",esc(grokP.model),"Weekly Allowance",esc(grokP.status_reason),"—",esc(grokP.quota_window),'<span class="tag t-unk">UNKNOWN</span>']);
for(const rl of RL)if(rl.is_active)quotaRows.push([esc(rl.provider),esc(rl.model),"HTTP 429 Backoff","100% (exceeded)",age(rl.remaining_s),"Retry in "+rl.remaining_s+"s",'<span class="tag t-bad">RATE_LIMITED</span>']);
for(const csl of CSL)if(csl.is_active)quotaRows.push(["anthropic (Claude)",esc(csl.model),"Session Limit","100% (exceeded)",csl.remaining_s!=null?age(csl.remaining_s):"UNKNOWN",esc(csl.reset_at||("Resets "+csl.reset_time_str+" ("+csl.timezone+")")),'<span class="tag t-bad">RATE_LIMITED</span>']);
const jobsList=FJ.jobs||[];
return `<h2>Section A // Fleet Model Availability</h2>
<div class="grid">${card("Configured Models",P.length,"detected providers; availability may be UNKNOWN",NOW,60)}${card("Provider-Reported Ready",availCount,"fresh quota plus current CLI auth; no live call issued",NOW,60,availCount>0?"ok":"")}${card("Rate-Limited Models",rlCount,"active observed retry/reset windows",NOW,60,rlCount>0?"bad":"")}${card("Auth Failed",authFailCount,"current CLI auth failure evidence only",NOW,60,authFailCount>0?"bad":"")}</div>
<div class="card" style="margin-top:10px">${table(["Provider","Model","Account Alias","Status","Observed Reason / Allowance"],P,p=>[esc(p.provider),`<b>${esc(p.model)}</b>`,esc(p.account_alias),`<span class="tag ${pTag(p.status)}">${esc(p.status)}</span>`,esc(p.status_reason||p.quota_window||"—")])}<div class="src">Real observations only · A valid login alone does not prove model availability</div></div>
<h2>Section B // Provider &amp; Account Overview</h2>
<div class="grid w2">${P.map(p=>`<div class="card"><div class="k">${esc(p.provider)} · ${esc(p.account_alias)}</div><div class="v sm">${esc(p.model)} <span class="tag ${pTag(p.status)}">${esc(p.status)}</span></div><div class="src">${esc(p.status_reason)}</div><div style="margin-top:6px;font-size:11px"><span class="dim">Quota/Window:</span> ${esc(p.quota_window)}<br><span class="dim">Measured Tokens:</span> ${p.measured_tokens!=null?N(p.measured_tokens)+` <span class="tag ${p.token_status==='MEASURED'?'t-ok':'t-unk'}">${esc(p.token_status||'UNKNOWN')}</span>`:'<span class="dim">UNKNOWN DATA</span>'}${p.other_models&&p.other_models.length?`<br><span class="dim">Other Models:</span> <span class="dim">${esc(p.other_models.slice(0,5).join(", "))}</span>`:''}</div></div>`).join("")}</div>
<h2>Section C // Quota &amp; Rate Limit Resets</h2>
<div class="card">${table(["Provider","Model","Window / Allowance","Usage %","Reset In","Reset Timestamp / Interval","Telemetry Status"],quotaRows,r=>r)}<div class="src">Parse existing runtime metadata only · Never invent subscription percentages or reset times</div></div>
<h2>Section D // Token Tracking &amp; Analytics</h2>
<div style="display:flex;gap:6px;margin:8px 0 12px;align-items:center"><span class="k">Time Window:</span>${["1h","24h","7d","30d","all"].map(w=>`<button onclick="window.muWindow='${w}';tick()" style="background:${curW===w?'var(--sig)':'var(--panel2)'};color:${curW===w?'#000':'var(--ink)'};border:1px solid var(--line);padding:3px 10px;font:inherit;cursor:pointer;font-size:10px;letter-spacing:.1em;text-transform:uppercase">${w}</button>`).join("")}</div>
<div class="grid">${card("Known Token Subtotal ("+curW.toUpperCase()+")",N(an.measured_tokens),an.measured_tokens_scope||"known source components only; full fleet total UNKNOWN",NOW,60)}${card("Input Tokens",N(an.input_tokens),"UNKNOWN: complete timestamped breakdown unavailable",NOW,60)}${card("Output Tokens",N(an.output_tokens),"UNKNOWN across providers for this window",NOW,60)}${card("Cache Read Tokens",N(an.cache_read_tokens),"UNKNOWN for this window",NOW,60)}${card("Cache Creation Tokens",N(an.cache_write_tokens),"UNKNOWN for this window",NOW,60)}${card("API Cash Expenditure",sp.fleet_model_usd==null?"—":"$"+sp.fleet_model_usd.toFixed(4),"cumulative fleet DB value; windowed spend UNKNOWN",NOW,60,"ok")}</div>
<div class="card" style="margin-top:10px"><div class="src">Claude cumulative account counters (last computed ${esc((d.claude_cumulative_usage||{}).last_computed_date||"UNKNOWN")}) include owner-interactive and autonomous usage without attribution. Messages: ${N((d.claude_cumulative_usage||{}).total_messages)}; sessions: ${N((d.claude_cumulative_usage||{}).total_sessions)}. These are cumulative account aggregates, not window counts or autonomous capacity.</div></div>
<div class="grid w2" style="margin-top:10px"><div class="card"><div class="k">Timestamped Local Records (${curW.toUpperCase()})</div>${table(["Provider / Runtime","Records","Available log history from"],Object.entries(an.requests_by_provider||{}),r=>[esc(r[0]),N(r[1]),coverageFor(r[0])?new Date(coverageFor(r[0])*1000).toISOString():"UNKNOWN"])}<div class="src">Counts cover records in available local logs, not provider HTTP requests. Earlier history is UNKNOWN. FETT subprocess completions are separate.</div></div><div class="card"><div class="k">Attribution &amp; Data Gaps</div>${table(["Item","Value"],[["FETT subprocess completions",JSON.stringify(an.fett_subprocess_completions_by_agent||{})],["Claude workflow attribution","UNKNOWN"],["Input/output/cache by account/window","UNKNOWN"],["OpenRouter / Local Qwen / AGY requests","UNKNOWN"]],r=>[esc(r[0]),esc(r[1])])}<div class="src">No inferred utilization or projected token counts</div></div></div>
<h2>Section E // Active NOVA FETT Lite Jobs</h2>
<div class="grid">${card("Active Job",FJ.active_job||"none","RUNNING process PID verified from job state",NOW,60,FJ.active_job?"ok":'')}${card("Total Jobs Recorded",N(FJ.total_count),"all persisted FETT Lite job directories",NOW,60)}${card("Rate-Limit Failures",N(FJ.rate_limit_failures),"jobs with rate-limit evidence in result/output",NOW,60,FJ.rate_limit_failures>0?"bad":"ok")}${card("Agent Time (scanned jobs)",(FJ.total_duration_s||0)+"s","sum of persisted results",NOW,60)}</div>
<div class="card" style="margin-top:10px">${table(["When","Job ID","Task Summary","Agents","Steps & Duration","Outcome","Token Accounting"],jobsList.slice(0,15),j=>[age(NOW-j.created_mtime)+" ago",`<code>${esc(j.job_id)}</code>`,`<span title="${esc(j.task)}">${esc(j.task.slice(0,50))}…</span>`,esc(j.agents.join(", ")||"—"),j.steps.map(s=>`${esc(s.agent)} (${esc(s.model)}, ${s.duration_s}s)`).join("<br>")||"—",`<span class="tag ${j.status==='DONE'?'t-ok':j.status==='FAILED'?'t-bad':'t-stale'}">${esc(j.status)}</span>${j.is_rate_limited?' <span class="tag t-bad">RATE_LIMITED</span>':''}`,'<span class="dim">UNKNOWN (NOT EXPOSED)</span>'])}<div class="src">Read-only FETT Lite state · Claude execution requires explicit owner authorization</div></div>
<h2>Section F // Provider Errors &amp; Live Alerts</h2>
<div class="grid w2"><div class="card"><div class="k">Provider Alerts</div>${AL.length?table(["Severity","Kind","Message"],AL,a=>[`<span class="tag ${a.severity==='ok'?'t-ok':a.severity==='unknown'?'t-unk':'t-bad'}">${esc(a.severity.toUpperCase())}</span>`,esc(a.kind),esc(a.message)]):'<span class="dim">No parsed active alerts; provider availability may be UNKNOWN.</span>'}<div class="src">Expired retry windows do not certify recovery</div></div><div class="card"><div class="k">Recent HTTP 429 &amp; Rate-Limit Events</div>${RL.length?table(["When","Provider","Model","Retry After","Remaining","Error Detail"],RL.slice(0,8),r=>[age(NOW-r.ts)+" ago",esc(r.provider),esc(r.model),r.retry_after_s+"s",r.is_active?`<span class="bad">${r.remaining_s}s</span>`:'<span class="dim">window elapsed; recovery UNKNOWN</span>',esc(r.error_detail.slice(0,60))]):'<span class="dim">No rate limit events recorded in recent log window.</span>'}<div class="src">Parsed from ~/.hermes/profiles/colt2822/logs/errors.log · initiating workflow UNKNOWN unless correlated</div></div></div>`}};
function nav(){document.getElementById("nav").innerHTML=VIEWS.map(v=>`<a href="#${v}" class="${v===view?"on":""}">${v.replace('_',' ')}</a>`).join("")}
async function tick(){try{const r=await fetch("/api/"+view,{cache:"no-store"});const d=await r.json();NOW=d.now||Date.now()/1000;
document.getElementById("stat").innerHTML=d.error?`<span class="bad">${esc(d.error)}</span>`:`<b>${view==="linkedin"?"LOCAL PLAN":"LIVE"}</b> ${new Date(NOW*1000).toLocaleTimeString()}`;
if(!d.error)document.getElementById("main").innerHTML=R[view](d)}catch(e){document.getElementById("stat").innerHTML=`<span class="bad">DASHBOARD BACKEND UNREACHABLE</span>`}}
addEventListener("hashchange",()=>{view=(location.hash||"#overview").slice(1);if(!VIEWS.includes(view))view="overview";nav();tick()});nav();tick();setInterval(tick,10000);
</script></body></html>
